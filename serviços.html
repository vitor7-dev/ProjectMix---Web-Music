<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectmix.com🎵</title>
    <style>
        body {
            background-image: url("img/fundotop.png");
            background-repeat: no repeat;
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;


        }

        h1 {
            text-align: center;
            color: white;
        }

        h2 {
            text-align: center;
            color: white;
        }

        .container {
            display: flex;
            gap: 10px;
            /* espaço entre imagens */
            justify-content: center;
            text-align: center;
        }

        .container img {
            width: 300px;
            /* largura igual para todas */
            height: 300px;
            /* altura igual para todas */
            object-fit: cover;
            /* mantém a proporção e corta o excesso */
            border-radius: 8px;
            /* opcional: cantos arredondados */
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 50px;
        }

        .galeria img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .link-frase {
            display: inline-block;
            margin-top: 20px;
            font-size: 18px;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .link-frase:hover {
            color: #4834d4;
            transform: scale(1.05);
        }
    </style>

</head>

<body>
    <h1>Serviços</h1>
    <br><br>
    <img src="img/produção.gif" alt="">
    <br><br><br>
    <h2>Cursos </h2>
    <div class="container">

        <div class="galeria">

            <div class="item">
                <img src="img/rockvenda.jpg" alt="ROCK">
                <a class="link-frase" href="cursorock.html" target="_blank">
                    ROCK
                </a>
            </div>

            <div class="item">
                <img src="img/rapvenda.jpg" alt="RAP">
                <a class="link-frase" href="cursorap.html" target="_blank">
                    RAP
                </a>
            </div>

            <div class="item">
                <img src="img/mpbvenda.jpg" alt="MPB">
                <a class="link-frase" href="cursompb.html" target="_blank">
                    MPB
                </a>
            </div>

            <div class="item">
                <img src="img/eletronicavenda.jpg" alt="ELETRONICA">
                <a class="link-frase" href="cursoeletronica.html" target="_blank">
                    ELETRONICA
                </a>
            </div>



        </div>
</body>

</html>
