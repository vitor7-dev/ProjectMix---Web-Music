<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectmix.com🎵</title>
    <style>
        body {
            background-image: url("img/fundotop.png");
            background-repeat: no repeat;
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;


        }

        h1 {
            text-align: center;
            color: white;
        }

        p {
            text-align: center;
            color: whitesmoke;
        }

        p {
            text-align: justify;
            /* deixa o texto em bloco */
            line-height: 1.6;
            /* espaço entre linhas, deixa mais legível */
            margin: 20px 0;
            /* espaço acima e abaixo do texto */
            font-size: 16px;
        }


        div {
            background-color: rgba(0, 0, 0, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 80px;
            border-radius: 15px;
            color: white;
        }

        input {
            padding: 15px;
            border: none;
            outline: none;
        }

        button {
            background-color: dodgerblue;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            color: white;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <h1>ROCK </h1>

    <div>
        <h1>Forma de pagamento</h1>
        <input type="text" placeholder="nome">
        <br><br>
        <input type="password" placeholder="senha">
        <br><br>
        <input type="text" placeholder="Endereço">
        <br><br>
        <input type="text" placeholder="numero">

        <button>Concluir</button><a>

    </div>
</body>

</html>
